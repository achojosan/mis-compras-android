<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1800px;height:900px;background:linear-gradient(135deg,#E8F3E2 0%,#FFF6DD 55%,#F4E2B0 100%);
       font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .row{display:flex;gap:46px;align-items:flex-start}
  .item{display:flex;flex-direction:column;align-items:center;gap:20px}
  .phone{width:302px;border-radius:44px;background:#16181A;padding:9px;box-shadow:0 26px 50px rgba(40,70,30,.28),0 4px 10px rgba(0,0,0,.18)}
  .phone img{display:block;width:100%;border-radius:36px}
  .cap{font-size:25px;font-weight:700;color:#1B4D20;text-align:center}
  .cap small{display:block;font-size:18px;font-weight:500;color:#5A5A4C;margin-top:4px}
  .tri{position:absolute;left:0;right:0;bottom:0;height:24px}
  .tri i{display:block;height:8px}
</style></head><body>
<div class="row">
  <div class="item"><div class="phone"><img src="../../screenshots/tiendas.png"></div><div class="cap">Tus tiendas<small>de un vistazo</small></div></div>
  <div class="item"><div class="phone"><img src="../../screenshots/ficha-tienda.png"></div><div class="cap">Cada tienda<small>horario, cómo llegar, tarjeta</small></div></div>
  <div class="item"><div class="phone"><img src="../../screenshots/tarjeta-cliente.png"></div><div class="cap">Tarjeta de cliente<small>lista para la caja</small></div></div>
  <div class="item"><div class="phone"><img src="../../screenshots/reconocer.png"></div><div class="cap">Reconocer<small>código de barras o aspecto</small></div></div>
  <div class="item"><div class="phone"><img src="../../screenshots/texto-muy-grande.png"></div><div class="cap">Texto muy grande<small>sin deformarse</small></div></div>
</div>
<div class="tri"><i style="background:#007A3D"></i><i style="background:#fff"></i><i style="background:#1A1A1A"></i></div>
</body></html>
