<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9D8C4"/>
      <stop offset="0.55" stop-color="#F6EFCB"/>
      <stop offset="1" stop-color="#FFE3A3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE08A" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFC857" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B7CC8F"/><stop offset="1" stop-color="#9FBF7E"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3BE63"/><stop offset="1" stop-color="#B7A34A"/></linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E9441"/><stop offset="1" stop-color="#2E7D32"/></linearGradient>
    <!-- Encina: tronco + copa redondeada (dehesa extremeña) -->
    <symbol id="encina" viewBox="0 0 100 100" overflow="visible">
      <path d="M47 100 C48 78 46 66 40 52 L47 54 C50 62 52 70 53 80 C55 70 58 60 66 48 L72 52 C64 64 60 78 59 100 Z" fill="#4A3B2A"/>
      <g fill="#2F5D2B">
        <ellipse cx="50" cy="34" rx="44" ry="26"/>
        <ellipse cx="24" cy="44" rx="24" ry="17"/>
        <ellipse cx="78" cy="44" rx="24" ry="17"/>
        <ellipse cx="50" cy="20" rx="30" ry="18"/>
      </g>
      <g fill="#3F7A36" opacity="0.8">
        <ellipse cx="42" cy="24" rx="22" ry="11"/>
        <ellipse cx="70" cy="36" rx="16" ry="8"/>
      </g>
    </symbol>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>
  <circle cx="1010" cy="250" r="190" fill="url(#sun)"/>
  <circle cx="1010" cy="250" r="64" fill="#FFD36B"/>

  <!-- aves -->
  <g fill="none" stroke="#3B5B3F" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M820 130 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M900 90 q10 -12 20 0 q10 -12 20 0"/>
    <path d="M1130 150 q12 -14 24 0 q12 -14 24 0"/>
  </g>

  <!-- colinas -->
  <path d="M0 430 C200 380 380 410 560 385 C760 355 960 370 1280 330 L1280 640 L0 640 Z" fill="url(#hill1)"/>
  <path d="M0 500 C220 450 420 480 640 455 C860 430 1060 450 1280 410 L1280 640 L0 640 Z" fill="url(#hill2)"/>
  <path d="M0 570 C260 520 520 560 760 535 C980 510 1130 525 1280 500 L1280 640 L0 640 Z" fill="url(#hill3)"/>

  <!-- encinas -->
  <use href="#encina" x="760" y="380" width="64" height="64" opacity="0.85"/>
  <use href="#encina" x="1130" y="332" width="58" height="58" opacity="0.85"/>
  <use href="#encina" x="900" y="410" width="104" height="104"/>
  <use href="#encina" x="1040" y="395" width="88" height="88"/>
  <use href="#encina" x="1170" y="430" width="120" height="120"/>
  <use href="#encina" x="640" y="470" width="96" height="96"/>
  <use href="#encina" x="20" y="500" width="80" height="80"/>

  <!-- carro y título -->
  <g transform="translate(70,98)">
    <rect width="118" height="118" rx="34" fill="#2E7D32"/>
    <g transform="translate(23,23) scale(3.0)" fill="#FFFCF5">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" transform="translate(0,-1)"/>
    </g>
  </g>
  <text x="70" y="318" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#1B4D20" letter-spacing="-2">Mis Compras</text>
  <text x="74" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#3A3A32">Tu lista de la compra, fácil de ver y de usar.</text>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="74" y="402" width="262" height="44" rx="22" fill="#FFFCF5" fill-opacity="0.9"/>
    <text x="205" y="432" text-anchor="middle" fill="#2E7D32">Hecha en Extremadura</text>
  </g>

  <!-- tricolor verde · blanco · negro (colores de la bandera de Extremadura) -->
  <rect y="616" width="1280" height="8" fill="#007A3D"/>
  <rect y="624" width="1280" height="8" fill="#FFFFFF"/>
  <rect y="632" width="1280" height="8" fill="#1A1A1A"/>
</svg>
